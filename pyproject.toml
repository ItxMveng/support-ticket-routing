[project]
name = "support-ticket-routing"
version = "0.1.0"
description = "Routage automatique des tickets de support : catégorie et priorité, modèle léger d'abord, LLM seulement quand il le faut."
readme = "README.md"
authors = [
    { name = "Francis Itoua", email = "francisitoua05@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
